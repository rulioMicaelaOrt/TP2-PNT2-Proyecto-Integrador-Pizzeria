name: CD - La Masa

on:
  workflow_run:
    workflows:
      - CI - La Masa
    types:
      - completed

jobs:
  deploy:
    name: Desplegar en Render
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Activar deploy en Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"